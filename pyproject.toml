[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saba-ai"
version = "1.0.0"
description = "Autonomous voice-interactive Persian companion robot server (RoboDesk)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC-BY-NC-SA-4.0"}
authors = [
    {name = "Saba AI Team"}
]
dependencies = [
    "websockets>=13.0.0",
    "peewee>=3.17.0",
    "openai>=1.50.0",
    "silero-vad>=5.1.0",
    "nemo-toolkit>=2.0.0",
    "soundfile>=0.12.0",
    "pocket-tts>=0.1.0",
    "sphn>=0.1.4",
    "PyYAML>=6.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
]

[project.scripts]
saba-server = "server.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "python_server*"]
